<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена (404) | Твой Выбор</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/assets/img/logo.webp">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/style.css">
  <style>
    .err404{
      min-height:100vh;
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:32px 20px;
      background:var(--page);
    }
    .err404__card{
      width:min(560px, 100%);
      padding:clamp(28px, 5vw, 48px) clamp(22px, 4vw, 40px);
      background:var(--white);
      border:1px solid var(--line);
      border-radius:var(--r-big);
      text-align:center;
      box-shadow:0 18px 48px rgba(0,0,0,.06);
    }
    .err404__logo{
      width:131px;
      height:auto;
      margin:0 auto 24px;
    }
    .err404__code{
      display:inline-block;
      padding:6px 16px;
      border-radius:var(--r-pill);
      background:#f1f8ed;
      color:var(--green-dark);
      font-size:14px;
      font-weight:800;
      letter-spacing:.04em;
    }
    .err404__title{
      margin-top:16px;
      font-size:clamp(28px, 4vw, 40px);
      font-weight:800;
      line-height:1.08;
      letter-spacing:-.03em;
    }
    .err404__text{
      margin:14px auto 0;
      max-width:420px;
      font-size:16px;
      line-height:1.45;
      color:var(--ink-54);
    }
    .err404__actions{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:12px;
      margin-top:28px;
    }
    .err404__actions .btn{min-width:210px}
    .err404__phone{
      display:inline-block;
      margin-top:20px;
      font-size:14px;
      color:var(--ink-54);
      text-decoration:underline;
      text-underline-offset:.2em;
    }
    .err404__phone:hover{color:var(--green-dark)}
    @media (max-width:520px){
      .err404__actions{flex-direction:column}
      .err404__actions .btn{width:100%}
    }
  </style>
</head>
<body>
  <main class="err404">
    <section class="err404__card">
      <a href="/" aria-label="Твой Выбор: на главную">
        <img class="err404__logo" src="/assets/img/logo.webp" alt="Твой Выбор" width="131" height="62">
      </a>
      <span class="err404__code">ОШИБКА 404</span>
      <h1 class="err404__title">Страница не найдена</h1>
      <p class="err404__text">Возможно, ссылка устарела или в адресе опечатка. Перейдите на главную страницу или сразу к выбору рациона.</p>
      <div class="err404__actions">
        <a class="btn btn--primary" href="/">
          На главную
          <img src="/assets/icons/arrow-white.svg" alt="" width="24" height="24" aria-hidden="true">
        </a>
        <a class="btn btn--ghost" href="/#menu">Подобрать рацион</a>
      </div>
      <a class="err404__phone" href="tel:+79026909192">Нужна помощь? 8 (902) 690-91-92</a>
    </section>
  </main>
</body>
</html>
